<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float-slow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(12px, -18px) scale(1.08); }
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33%      { transform: translate(20px, 12px) rotate(6deg); }
      66%      { transform: translate(-16px, 8px) rotate(-6deg); }
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.85); }
      70%  { opacity: 1; transform: scale(1.04); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-7px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(3px); }
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 10px 25px -10px rgba(167, 139, 250, 0.55); }
      50%      { box-shadow: 0 14px 35px -10px rgba(167, 139, 250, 0.9); }
    }
    @keyframes sheen {
      0%   { transform: translateX(-120%) rotate(12deg); }
      100% { transform: translateX(220%) rotate(12deg); }
    }
    @keyframes grad-shift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .blob-1 { animation: float-slow 14s ease-in-out infinite; }
    .blob-2 { animation: drift 20s ease-in-out infinite; }
    .blob-3 { animation: float-slow 18s ease-in-out infinite reverse; }

    .anim-rise { opacity: 0; animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-pop  { opacity: 0; animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
    .anim-icon { animation: rise-in 0.7s ease-out 0.1s both, glow-pulse 3s ease-in-out 1s infinite; }
    .is-error  { animation: shake 0.4s ease-in-out; }

    .btn-sheen { position: relative; overflow: hidden; }
    .btn-sheen::after {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: translateX(-120%) rotate(12deg);
      animation: sheen 4.5s ease-in-out infinite;
    }
    .btn-sheen:hover::after { animation-duration: 1.2s; }

    .bg-anim {
      background-size: 200% 200%;
      animation: grad-shift 18s ease infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans antialiased bg-anim bg-gradient-to-br from-sky-100 via-violet-100 to-rose-100">

  <!-- blur blobs -->
  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="blob-1 absolute -top-24 -left-16 h-72 w-72 rounded-full bg-sky-300/40 blur-3xl"></div>
    <div class="blob-2 absolute top-1/3 -right-20 h-80 w-80 rounded-full bg-fuchsia-300/30 blur-3xl"></div>
    <div class="blob-3 absolute -bottom-24 left-1/3 h-72 w-72 rounded-full bg-rose-300/30 blur-3xl"></div>
  </div>

  <div class="anim-rise relative w-full max-w-lg rounded-3xl bg-white/70 backdrop-blur-xl border border-white/60 shadow-2xl shadow-violet-200/60 p-8 sm:p-10">

    <div class="text-center mb-8">
      <div class="anim-icon mx-auto mb-4 h-14 w-14 rounded-2xl bg-gradient-to-br from-sky-400 to-fuchsia-500 flex items-center justify-center shadow-lg shadow-fuchsia-200">
        <svg class="h-7 w-7 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </div>
      <h1 class="text-3xl font-bold tracking-tight">
        <span class="bg-gradient-to-r from-sky-500 via-violet-500 to-rose-500 bg-clip-text text-transparent">
          Form Register
        </span>
      </h1>
      <p class="mt-2 text-sm text-slate-500">Silakan lengkapi data Anda di bawah ini</p>
    </div>

    <form id="formRegister" action="dashboard.html" method="get" novalidate class="space-y-5">

      <div class="anim-rise" style="animation-delay:0.15s">
        <label for="username" class="mb-1.5 block text-sm font-semibold text-slate-700">Username</label>
        <input type="text" id="username" name="username" placeholder="Minimal 3 karakter" autocomplete="username"
          class="w-full rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm text-slate-700 shadow-sm transition placeholder:text-slate-400 focus:border-violet-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100" />
        <p id="err-username" class="mt-1.5 hidden text-xs font-medium text-rose-500"></p>
      </div>

      <div class="anim-rise" style="animation-delay:0.23s">
        <label for="password" class="mb-1.5 block text-sm font-semibold text-slate-700">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimal 8 karakter" autocomplete="new-password"
          class="w-full rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm text-slate-700 shadow-sm transition placeholder:text-slate-400 focus:border-violet-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100" />
        <p id="err-password" class="mt-1.5 hidden text-xs font-medium text-rose-500"></p>
      </div>

      <div class="anim-rise" style="animation-delay:0.31s">
        <label for="nama" class="mb-1.5 block text-sm font-semibold text-slate-700">Nama Lengkap</label>
        <input type="text" id="nama" name="nama" placeholder="Nama lengkap kamu" autocomplete="name"
          class="w-full rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm text-slate-700 shadow-sm transition placeholder:text-slate-400 focus:border-violet-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100" />
        <p id="err-nama" class="mt-1.5 hidden text-xs font-medium text-rose-500"></p>
      </div>

      <div class="anim-rise" style="animation-delay:0.39s">
        <label for="tanggalLahir" class="mb-1.5 block text-sm font-semibold text-slate-700">Tanggal Lahir</label>
        <input type="date" id="tanggalLahir" name="tanggalLahir"
          class="w-full rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm text-slate-700 shadow-sm transition focus:border-violet-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100" />
        <p id="err-tanggalLahir" class="mt-1.5 hidden text-xs font-medium text-rose-500"></p>
      </div>

      <div class="anim-rise" style="animation-delay:0.47s">
        <label for="alamat" class="mb-1.5 block text-sm font-semibold text-slate-700">Alamat</label>
        <textarea id="alamat" name="alamat" rows="3" placeholder="Alamat lengkap kamu" autocomplete="street-address"
          class="w-full resize-none rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm text-slate-700 shadow-sm transition placeholder:text-slate-400 focus:border-violet-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100"></textarea>
        <p id="err-alamat" class="mt-1.5 hidden text-xs font-medium text-rose-500"></p>
      </div>

      <div class="anim-rise" style="animation-delay:0.55s">
        <label for="noTelp" class="mb-1.5 block text-sm font-semibold text-slate-700">Nomor Telepon</label>
        <input type="text" id="noTelp" name="noTelp" inputmode="numeric" placeholder="Contoh: 6281234567890"
          class="w-full rounded-xl border border-slate-200 bg-white/80 px-4 py-2.5 text-sm text-slate-700 shadow-sm transition placeholder:text-slate-400 focus:border-violet-300 focus:bg-white focus:outline-none focus:ring-4 focus:ring-violet-100" />
        <p id="err-noTelp" class="mt-1.5 hidden text-xs font-medium text-rose-500"></p>
      </div>

      <div class="anim-rise" style="animation-delay:0.63s">
        <button type="submit" class="btn-sheen w-full rounded-xl bg-gradient-to-r from-sky-500 via-violet-500 to-rose-500 py-3 font-semibold text-white transition active:scale-[0.98]">
          Daftar Sekarang
        </button>
      </div>
    </form>
  </div>
</body>

<script src="validasi_input.js"></script>
</html>
