<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes float-slow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50%      { transform: translate(12px, -18px) scale(1.08); }
    }
    @keyframes drift {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33%      { transform: translate(20px, 12px) rotate(6deg); }
      66%      { transform: translate(-16px, 8px) rotate(-6deg); }
    }
    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop-in {
      0%   { opacity: 0; transform: scale(0.6) rotate(-12deg); }
      70%  { opacity: 1; transform: scale(1.08) rotate(4deg); }
      100% { opacity: 1; transform: scale(1) rotate(0deg); }
    }
    @keyframes draw-check { to { stroke-dashoffset: 0; } }
    @keyframes ring-pulse {
      0%   { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.45); }
      70%  { box-shadow: 0 0 0 22px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }
    @keyframes sheen {
      0%   { transform: translateX(-120%) rotate(12deg); }
      100% { transform: translateX(220%) rotate(12deg); }
    }
    @keyframes grad-shift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .blob-1 { animation: float-slow 14s ease-in-out infinite; }
    .blob-2 { animation: drift 20s ease-in-out infinite; }
    .blob-3 { animation: float-slow 18s ease-in-out infinite reverse; }

    .anim-rise { opacity: 0; animation: rise-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .anim-icon { animation: pop-in 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) 0.15s both, ring-pulse 2.4s ease-out 1.2s infinite; }
    .check-path { stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw-check 0.5s ease-out 0.7s forwards; }
    .btn-sheen { position: relative; overflow: hidden; }
    .btn-sheen::after {
      content: "";
      position: absolute; top: 0; bottom: 0; left: 0; width: 45%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: translateX(-120%) rotate(12deg);
      animation: sheen 4s ease-in-out infinite;
    }
    .btn-sheen:hover::after { animation-duration: 1.1s; }
    .bg-anim { background-size: 200% 200%; animation: grad-shift 18s ease infinite; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 font-sans antialiased bg-anim bg-gradient-to-br from-emerald-100 via-sky-100 to-violet-100">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="blob-1 absolute -top-24 -left-16 h-72 w-72 rounded-full bg-emerald-300/40 blur-3xl"></div>
    <div class="blob-2 absolute top-1/3 -right-20 h-80 w-80 rounded-full bg-sky-300/30 blur-3xl"></div>
    <div class="blob-3 absolute -bottom-24 left-1/3 h-72 w-72 rounded-full bg-violet-300/30 blur-3xl"></div>
  </div>

  <div class="anim-rise relative w-full max-w-md rounded-3xl bg-white/70 backdrop-blur-xl border border-white/60 shadow-2xl shadow-sky-200/60 p-10 text-center">

    <div class="anim-icon mx-auto mb-6 h-16 w-16 rounded-2xl bg-gradient-to-br from-emerald-400 to-sky-500 flex items-center justify-center shadow-lg shadow-emerald-200">
      <svg class="h-9 w-9 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
        <path class="check-path" stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <h1 class="anim-rise text-3xl font-bold tracking-tight" style="animation-delay:0.35s">
      <span class="bg-gradient-to-r from-emerald-500 via-sky-500 to-violet-500 bg-clip-text text-transparent">
        Registrasi Berhasil
      </span>
    </h1>

    <p class="anim-rise mt-3 text-sm leading-relaxed text-slate-500" style="animation-delay:0.45s">
      Selamat datang! Data Anda berhasil dikirim dan akan kami proses lebih lanjut.
    </p>

    <div class="anim-rise mt-8" style="animation-delay:0.6s">
      <a href="register.html"
        class="btn-sheen inline-block rounded-xl bg-gradient-to-r from-emerald-400 to-sky-500 px-8 py-3 font-semibold text-white shadow-lg shadow-sky-200 transition active:scale-95">
        Kembali ke Register
      </a>
    </div>
  </div>
</body>
</html>
